---
- name: Check current Helm installation
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_current
  changed_when: false
  failed_when: false


- name: Display current Helm version
  ansible.builtin.debug:
    msg: >-
      Current Helm:
      {{ helm_current.stdout if helm_current.rc == 0 else 'not installed' }}


- name: Install Helm
  when:
    - helm_current.rc != 0 or helm_version not in helm_current.stdout
  block:

    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "{{ helm_download_url }}"
        dest: "/tmp/{{ helm_archive }}"
        mode: "0644"

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ helm_archive }}"
        dest: /tmp
        remote_src: true

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "/tmp/{{ helm_os }}-{{ helm_arch }}/helm"
        dest: "{{ helm_install_dir }}/helm"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Remove Helm archive
      ansible.builtin.file:
        path: "/tmp/{{ helm_archive }}"
        state: absent

    - name: Remove extracted Helm directory
      ansible.builtin.file:
        path: "/tmp/{{ helm_os }}-{{ helm_arch }}"
        state: absent


- name: Verify Helm installation
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_verify
  changed_when: false


- name: Display installed Helm version
  ansible.builtin.debug:
    var: helm_verify.stdout